name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Verify plugin
        run: ./gradlew verifyPlugin --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bracketbow-plugin
          path: build/distributions/bracketbow-*.zip
          retention-days: 30

      # Sadece master push'larında release oluştur (PR'larda çalışmaz)
      - name: Extract version from build.gradle.kts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: version
        run: |
          VERSION=$(grep '^version = ' build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Bracketbow ${{ steps.version.outputs.tag }}"
          body_path: CHANGELOG.md
          files: build/distributions/bracketbow-*.zip
          draft: false
          prerelease: false

      - name: Publish to JetBrains Marketplace
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon
