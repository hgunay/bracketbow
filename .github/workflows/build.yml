name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Tüm tag geçmişi gerekli (semver hesabı için)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # PR'larda sadece build + verify; release yok
      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Verify plugin
        run: ./gradlew verifyPlugin --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bracketbow-plugin
          path: build/distributions/bracketbow-*.zip
          retention-days: 30

      # --- Aşağısı sadece master push'larında çalışır ---

      - name: Auto-bump version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch        # prefix yoksa patch artır
          release_branches: master

      - name: Rebuild with new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: ./gradlew buildPlugin --no-daemon -Pversion=${{ steps.tag.outputs.new_version }}

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: "Bracketbow ${{ steps.tag.outputs.new_tag }}"
          body: ${{ steps.tag.outputs.changelog }}
          files: build/distributions/bracketbow-*.zip
          draft: false
          prerelease: false

      - name: Publish to JetBrains Marketplace
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true  # İlk manuel yükleme yapılana kadar build'i bloklamaması için
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon -Pversion=${{ steps.tag.outputs.new_version }}
